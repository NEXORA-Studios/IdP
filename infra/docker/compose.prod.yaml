# Production compose. Requires a populated env file (infra/deploy/production.env,
# never committed). Internal services publish NO ports to the host: only Caddy
# terminates TLS and reaches the apps. Credentials are injected, never hardcoded.
#
# Deploy: docker compose --env-file infra/deploy/production.env -f infra/docker/compose.prod.yaml up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - idp
      - accounts

  idp:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.idp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      VAULT_ADDR: http://vault:8200
      VAULT_APPROLE_ROLE_ID: ${VAULT_APPROLE_ROLE_ID}
      VAULT_APPROLE_SECRET_ID: ${VAULT_APPROLE_SECRET_ID}
      SIGNING_KEY_REFERENCE: ${SIGNING_KEY_REFERENCE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    # No ports published; reachable only via the compose network.

  accounts:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.accounts
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      VAULT_ADDR: http://vault:8200
      VAULT_APPROLE_ROLE_ID: ${VAULT_APPROLE_ROLE_ID}
      VAULT_APPROLE_SECRET_ID: ${VAULT_APPROLE_SECRET_ID}
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    # No ports published.

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports published; reachable only from the compose network.

  vault:
    image: hashicorp/vault:1.19
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: |
        storage "file" {
          path = "/vault/data"
        }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = 0
        }
      VAULT_ADDR: https://vault:8200
    volumes:
      - vault_data:/vault/data
      - ./vault/unseal.sh:/unseal.sh:ro
    entrypoint: ["/bin/sh", "/unseal.sh"]
    # No ports published; unseal key shares are injected via env by the
    # operator or provided by an auto-unseal mechanism (see docs/deployment.md §3).

  # Mailpit intentionally absent: production sends through the configured
  # SMTP provider; no local mail catcher in production.

volumes:
  pgdata:
  vault_data:
  caddy_data:
  caddy_config:
